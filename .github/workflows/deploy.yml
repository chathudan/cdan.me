name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions for GitHub Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys — cancel in-progress runs on new push,
# but let the current deploy finish so we don't leave Pages in a half-state.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Secret scan — fails fast if anything sensitive slipped in
  scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the workflow if a leak is found (default behaviour).
          # Set GITLEAKS_ENABLE_UPLOAD_ARTIFACT=true to upload the report.

  # 2. Build the static site
  build:
    name: Build site
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 3. Deploy — only runs on push to main (not on PRs)
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
